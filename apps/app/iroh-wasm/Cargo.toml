[package]
name = "mondash-iroh"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
iroh = { version = "=1.0.2", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
serde_json = "1"
base64 = "0.22"
console_error_panic_hook = "0.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
