name: Bug report
description: Report a reproducible problem without sharing private work.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and environment
      description: Include macOS, Bun, Node and enabled providers. Redact all credentials and private work.
    validations:
      required: true
